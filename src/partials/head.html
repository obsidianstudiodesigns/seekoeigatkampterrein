<!doctype html>
<html lang="af">
<head>
  <meta charset="utf-8">
{{head_extra}}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}">
  <link rel="canonical" href="{{url}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#17231b">
  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Seekoeigat Kampterrein">
  <meta property="og:locale" content="af_ZA">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:secure_url" content="{{og_image}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lugfoto van Seekoeigat Kampterrein se kampeerterrein op die oewer van die Olifantsrivier">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{desc}}">
  <meta name="twitter:image" content="{{og_image}}">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preload" href="assets/fonts/cabinetgrotesk-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/satoshi-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v={{ver}}">
  <script>(function(d){var m=!matchMedia('(prefers-reduced-motion: reduce)').matches;d.classList.toggle('js-motion',m);if(m)setTimeout(function(){if(!window.__motionReady)d.classList.remove('js-motion')},4000)})(document.documentElement);</script>
</head>
